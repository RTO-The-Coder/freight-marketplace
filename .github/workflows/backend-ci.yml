name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: freight_marketplace
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freight -d freight_marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      # Freight.Api.Tests and Freight.Infrastructure.Tests each migrate the same
      # shared Postgres service container in their test setup; a single
      # solution-wide `dotnet test` run runs test projects concurrently, which
      # let those migrations race across process boundaries and fail
      # intermittently ("relation already exists" / "table does not exist").
      # One step per project keeps every project's tests fully sequential.
      - name: Test (Freight.Domain.Tests)
        working-directory: backend
        run: dotnet test tests/Freight.Domain.Tests --no-build --configuration Release

      - name: Test (Freight.Application.Tests)
        working-directory: backend
        run: dotnet test tests/Freight.Application.Tests --no-build --configuration Release

      - name: Test (Freight.Infrastructure.Tests)
        working-directory: backend
        run: dotnet test tests/Freight.Infrastructure.Tests --no-build --configuration Release

      - name: Test (Freight.Api.Tests)
        working-directory: backend
        run: dotnet test tests/Freight.Api.Tests --no-build --configuration Release

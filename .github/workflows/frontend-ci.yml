name: Frontend CI

on:
  push:
    paths:
      - "frontend/fleetmanagement/**"
      - "frontend/api-client/**"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/fleetmanagement/**"
      - "frontend/api-client/**"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck core
        working-directory: frontend/fleetmanagement/core
        run: npx tsc --noEmit

      - name: Vitest unit tests (core)
        working-directory: frontend/fleetmanagement/core
        run: npm test

      - name: Typecheck web
        working-directory: frontend/fleetmanagement/web
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Vitest unit tests (web)
        working-directory: frontend/fleetmanagement/web
        run: npm test

      - name: Typecheck mobile
        working-directory: frontend/fleetmanagement/mobile
        run: npx tsc --noEmit

      - name: Jest component tests (mobile)
        working-directory: frontend/fleetmanagement/mobile
        run: npx jest --ci

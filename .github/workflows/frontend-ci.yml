name: Frontend CI

on:
  push:
    paths:
      - "packages/web/**"
      - "packages/api-client/**"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "packages/web/**"
      - "packages/api-client/**"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: packages/web
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Vitest unit tests
        working-directory: packages/web
        run: npm test
